# Wiki's copy of con-services shared/nginx/security-headers.conf, with the
# development origins filled in (Keycloak and Den in the suite's Compose
# stack). The image installs it at /etc/nginx/snippets/security-headers.conf;
# the Helm chart mounts one rendered from its values over it, and a
# production Docker install mounts its own (docs: modules/wiki/setup).
# /silent-callback.html is the exception: that location includes
# security-headers-frame-self.conf (same origins, frame-ancestors 'self').
#
# Security headers for a Con Services web app (the nginx that serves the
# React frontend). Source: con-services shared/nginx/security-headers.conf.
# Docs: https://aglelectronics.github.io/con-services/concepts/shared-code/#nginx-security-headers
#
# How to use it:
#   1. Copy this file next to the app's nginx.conf (for example
#      infra/security-headers.conf) and into the image at
#      /etc/nginx/snippets/security-headers.conf.
#   2. Replace the two placeholders in Content-Security-Policy:
#        KEYCLOAK_ORIGIN  the sign-in server, e.g. https://auth.con.example.org
#        DEN_ORIGIN       Den, e.g. https://den.con.example.org (for the
#                         "back to Den" link and Den-hosted assets); remove
#                         it when the app never talks to Den from the browser.
#      Origins are scheme + host (+ port), no path.
#   3. include it in the server block AND in every location that has its own
#      add_header: nginx drops inherited add_header lines in a location that
#      sets any add_header of its own.
#        server {
#            include /etc/nginx/snippets/security-headers.conf;
#            location / {
#                include /etc/nginx/snippets/security-headers.conf;
#                add_header Cache-Control "no-cache, must-revalidate" always;
#            }
#        }
#   4. Check: curl -sI https://hr.con.example.org/ | grep -i -E 'content-security|x-frame|referrer|permissions|nosniff'
#
# Not here on purpose: Strict-Transport-Security (HSTS) is set once at the
# Gateway or Caddy, which terminates TLS for every host. API responses get
# their headers from the backend (authbase.SecurityHeaders).

# Scripts, styles, fonts and images only from the app itself; data: and blob:
# images for uploads and previews; API calls to the app (same origin, the
# backend is proxied under /api), the sign-in server and Den. The app may
# not be framed by anyone, and forms post only to itself or Keycloak.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://auth.conservices.test http://localhost:8085 https://den.conservices.test; frame-src 'self' https://auth.conservices.test http://localhost:8085; frame-ancestors 'none'; form-action 'self' https://auth.conservices.test http://localhost:8085; base-uri 'self'; object-src 'none'" always;

# Older browsers that do not know frame-ancestors.
add_header X-Frame-Options "DENY" always;

# Never guess a content type from the bytes.
add_header X-Content-Type-Options "nosniff" always;

# Send only the origin to other sites, nothing over plain HTTP.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Browser features. Only Stash scans barcodes with the camera: in Stash's copy
# use camera=(self); every other app keeps camera=().
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
