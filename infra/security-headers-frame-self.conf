# Wiki's copy of con-services shared/nginx/security-headers-frame-self.conf,
# with the same development origins as infra/security-headers.conf
# (Keycloak and Den in the suite's Compose stack). The image installs it at
# /etc/nginx/snippets/security-headers-frame-self.conf. The Helm chart mounts
# one rendered from its values over it, and a production Docker install
# mounts its own next to security-headers.conf.
# Docs: https://aglelectronics.github.io/con-services/concepts/shared-code/#silent-sign-in-iframe
#
# Include it only from the exact location that serves the silent sign-in
# page. Every other response keeps security-headers.conf (frame-ancestors
# 'none', X-Frame-Options DENY):
#
#   location = /silent-callback.html {
#       include /etc/nginx/snippets/security-headers-frame-self.conf;
#       add_header Cache-Control "no-cache" always;
#   }

# Same policy as security-headers.conf. This one page may be framed by Wiki
# itself, so a reload can sign in again through the hidden iframe. Forms
# still post only to Wiki or Keycloak.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://auth.conservices.test http://localhost:8085 https://den.conservices.test; frame-src 'self' https://auth.conservices.test http://localhost:8085; frame-ancestors 'self'; form-action 'self' https://auth.conservices.test http://localhost:8085; base-uri 'self'; object-src 'none'" always;

# Older browsers that do not know frame-ancestors. SAMEORIGIN, not DENY.
add_header X-Frame-Options "SAMEORIGIN" always;

# Never guess a content type from the bytes.
add_header X-Content-Type-Options "nosniff" always;

# Send only the origin to other sites, nothing over plain HTTP.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Browser features. Only Stash scans barcodes with the camera; Wiki keeps camera=().
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
