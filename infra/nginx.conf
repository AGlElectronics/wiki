upstream wiki_backend {
    # Container-internal port is :8080 for every module in this ecosystem.
    # Host-side mapping (host:8140 -> container:8080) lives in docker-compose.yml.
    server backend:8080;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads go through the backend (no presigned URLs, so the page access
    # check always runs). Limits are 25 MB for images and 50 MB for other
    # files, plus multipart overhead.
    client_max_body_size 52m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # API reverse proxy — the SPA calls /api/... relative so the same
    # origin serves both static assets and the API; avoids CORS in prod.
    # Live editing websockets: kept open while a page is, pinged every 30s.
    location ~ ^/api/v1/pages/[^/]+/live$ {
        proxy_pass http://wiki_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://wiki_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_pass_request_headers on;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # Liveness / readiness pass through so orchestrator probes can target
    # the frontend origin and still reach the backend without exposing a
    # separate port.
    location = /livez {
        proxy_pass http://wiki_backend/livez;
    }
    location = /readyz {
        proxy_pass http://wiki_backend/readyz;
    }

    # Installation settings of the web app (sign-in address and the like),
    # mounted at /etc/conservices. Never cached, so a change shows on reload.
    location = /config.json {
        alias /etc/conservices/config.json;
        add_header Cache-Control "no-store" always;
    }

    # SPA fallback. Every unknown path returns index.html so TanStack
    # Router's client-side routes resolve on hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
